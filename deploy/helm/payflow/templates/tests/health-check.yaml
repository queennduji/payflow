apiVersion: v1
kind: Pod
metadata:
  name: payflow-health-check
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.0
      command: ["curl", "--fail", "--silent", "--show-error", "http://gateway:8080/health"]
