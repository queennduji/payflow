apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-export
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
data:
  realm-export.json: |
{{ .Files.Get "files/realm-export.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
            # Same reasoning as the docker-compose service: a full URL plus hostname-strict pins
            # the issuer regardless of how Keycloak was reached (in-cluster Service vs. a
            # port-forwarded host connection) — a bare hostname isn't enough, since Keycloak still
            # echoes back whatever port the request arrived on.
            - name: KC_HOSTNAME
              value: http://keycloak:8080
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          volumeMounts:
            - name: realm-export
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
          readinessProbe:
            # Keycloak 26 serves /health on its separate management port (9000), not the main one.
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: realm-export
          configMap:
            name: keycloak-realm-export
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - port: 8080
      targetPort: 8080
