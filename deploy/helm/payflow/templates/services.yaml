{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "payflow.labels" $ | nindent 4 }}
    {{- include "payflow.selectorLabels" . | nindent 4 }}
spec:
  # Single replica everywhere: migrations run on startup (see each service's Program.cs), which
  # would race across replicas — a documented Phase 1 simplification this chart doesn't change.
  replicas: 1
  selector:
    matchLabels:
      {{- include "payflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .dependsOnPostgres }}
      # docker-compose gates container start on `depends_on: condition: service_healthy`;
      # Kubernetes has no equivalent, so this waits out the same dependency before the app tries
      # its (unretried) startup migration — see Program.cs's own db.Database.MigrateAsync() call.
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .dependsOnPostgres }} 5432; do echo "waiting for {{ .dependsOnPostgres }}..."; sleep 2; done
              {{- if .dependsOnRabbitMq }}
              until nc -z rabbitmq 5672; do echo "waiting for rabbitmq..."; sleep 2; done
              {{- end }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ .image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payflow-secrets
                  key: postgres-password
            {{- range $key, $value := .env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "payflow.labels" $ | nindent 4 }}
    {{- include "payflow.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "payflow.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
---
{{- end }}
