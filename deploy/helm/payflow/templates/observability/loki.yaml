apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      containers:
        - name: loki
          image: {{ .Values.observability.lokiImage }}
          ports:
            - containerPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - port: 3100
      targetPort: 3100
