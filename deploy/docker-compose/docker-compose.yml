name: payflow

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-payments:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payments_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-ledger:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5433:5432"
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d ledger_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-fraud:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5434:5432"
    volumes:
      - fraud-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d fraud_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-notifications:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5435:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d notifications_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-authorization:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authorization_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5436:5432"
    volumes:
      - authorization-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d authorization_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Observability stack: every service ships traces/metrics/logs via OTLP to the collector,
  # which fans them out to the three storage backends. Grafana is the one place to look at all
  # three, correlated.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  authorization-api:
    build:
      context: ../..
      dockerfile: src/Services/Authorization/Payflow.Authorization.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthorizationDb: "Host=postgres-authorization;Port=5432;Database=authorization_db;Username=payflow;Password=payflow"
      RabbitMq__Host: "rabbitmq"
      Otel__CollectorUrl: "http://otel-collector:4317"
      # Chance (0.0-1.0) that the simulated card network call fails outright.
      # Bump this via `docker compose up -d --build authorization-api` after editing, or
      # `docker compose run -e Chaos__CardNetworkFaultRate=0.6 ...`, to watch the circuit breaker trip.
      Chaos__CardNetworkFaultRate: "0.0"
    depends_on:
      postgres-authorization:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "5081:8080"

  ledger-api:
    build:
      context: ../..
      dockerfile: src/Services/Ledger/Payflow.Ledger.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LedgerDb: "Host=postgres-ledger;Port=5432;Database=ledger_db;Username=payflow;Password=payflow"
      RabbitMq__Host: "rabbitmq"
      Otel__CollectorUrl: "http://otel-collector:4317"
    depends_on:
      postgres-ledger:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "5204:8080"

  fraud-api:
    build:
      context: ../..
      dockerfile: src/Services/Fraud/Payflow.Fraud.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FraudDb: "Host=postgres-fraud;Port=5432;Database=fraud_db;Username=payflow;Password=payflow"
      RabbitMq__Host: "rabbitmq"
      Otel__CollectorUrl: "http://otel-collector:4317"
    depends_on:
      postgres-fraud:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "5277:8080"

  notifications-api:
    build:
      context: ../..
      dockerfile: src/Services/Notifications/Payflow.Notifications.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationsDb: "Host=postgres-notifications;Port=5432;Database=notifications_db;Username=payflow;Password=payflow"
      RabbitMq__Host: "rabbitmq"
      Otel__CollectorUrl: "http://otel-collector:4317"
    depends_on:
      postgres-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "5229:8080"

  payments-api:
    build:
      context: ../..
      dockerfile: src/Services/Payments/Payflow.Payments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentsDb: "Host=postgres-payments;Port=5432;Database=payments_db;Username=payflow;Password=payflow"
      RabbitMq__Host: "rabbitmq"
      Otel__CollectorUrl: "http://otel-collector:4317"
    depends_on:
      postgres-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      authorization-api:
        condition: service_started
      ledger-api:
        condition: service_started
      fraud-api:
        condition: service_started
      notifications-api:
        condition: service_started
    ports:
      - "5218:8080"

  gateway:
    build:
      context: ../..
      dockerfile: src/Gateway/Payflow.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__payments__Destinations__destination1__Address: "http://payments-api:8080"
      ReverseProxy__Clusters__ledger__Destinations__destination1__Address: "http://ledger-api:8080"
      ReverseProxy__Clusters__fraud__Destinations__destination1__Address: "http://fraud-api:8080"
      ReverseProxy__Clusters__notifications__Destinations__destination1__Address: "http://notifications-api:8080"
      Otel__CollectorUrl: "http://otel-collector:4317"
    depends_on:
      - payments-api
      - ledger-api
      - fraud-api
      - notifications-api
      - otel-collector
    ports:
      - "8080:8080"

volumes:
  payments-db-data:
  ledger-db-data:
  fraud-db-data:
  notifications-db-data:
  authorization-db-data:
